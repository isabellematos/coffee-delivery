# Blueprint do Render: site estático (SPA) gerado pelo Vite.
# No Render: New → Blueprint → selecionar este repositório.
services:
  - type: web
    name: coffee-delivery
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Todas as rotas (/checkout, /success...) servem o index.html; o React Router resolve no navegador.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
